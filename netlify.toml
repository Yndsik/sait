[build]
  publish = "dist"
  command = "node scripts/build.cjs"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "geolocation=(), camera=(self), microphone=(self), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://ougbjjfrxfokyqqriqtx.supabase.co; connect-src 'self' https://ougbjjfrxfokyqqriqtx.supabase.co wss://ougbjjfrxfokyqqriqtx.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; upgrade-insecure-requests"
[[headers]]
  for = "/schedule.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/auth-config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=RIVLO-Android-test-2.0.0.apk"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/downloads/android.json"
  [headers.values]
    Cache-Control = "no-cache"
